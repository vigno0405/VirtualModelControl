name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      all_os:
        description: "Also run the tests on macOS and Windows"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: lint-imports
      - run: pre-commit run --all-files

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.10", numpy: "numpy>=1.26,<2" }
          - { os: ubuntu-22.04, python: "3.10", numpy: "numpy>=2" }
          - { os: ubuntu-24.04, python: "3.12", numpy: "numpy>=1.26,<2" }
          - { os: ubuntu-24.04, python: "3.12", numpy: "numpy>=2" }
          - { os: ubuntu-24.04, python: "3.14", numpy: "numpy>=2" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]" "${{ matrix.numpy }}"
      - run: python -m pytest

  # What a user does on a fresh Ubuntu: the system Python, a venv, pip install of the package.
  clean-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y python3-venv
      - run: python3 -m venv /tmp/build && /tmp/build/bin/pip install build && /tmp/build/bin/python -m build --wheel
      - run: python3 -m venv /tmp/user && /tmp/user/bin/pip install dist/*.whl pytest
      - run: /tmp/user/bin/python -c "import virtualmodelcontrol as vmc; print(vmc.__version__)"
      - run: /tmp/user/bin/python -m pytest -q -p no:cacheprovider

  # The ROS 2 bridge in the distributions the robots run, on a private domain, this host only.
  ros:
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
    runs-on: ubuntu-latest
    container: ros:${{ matrix.distro }}-ros-core
    env:
      ROS_DOMAIN_ID: "73"
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      ROS_LOCALHOST_ONLY: "1"
    defaults:
      run:
        shell: bash
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git python3-pip python3-venv
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # A recent pip keeps the system's old packages out of the package build (Humble's is 22.0).
      - run: |
          python3 -m venv --system-site-packages /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install -e ".[dev]"
      # ROS's own pytest plugins do not load with a recent pytest; these tests do not need them.
      - run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          /tmp/venv/bin/python -m pytest -q -p no:cacheprovider -p no:launch_testing -p no:launch_ros tests/ros

  other-os:
    if: github.event_name == 'workflow_dispatch' && inputs.all_os
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest
